<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Sicheng Qian</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/fonts.css">
<style>
  :root {
    --serif: "Fraunces", Georgia, serif;
    --sans: "Inter Tight", -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    --bg: #07080a;
    --text: #f4f1ea;
    --muted: #8b959c;
    --accent: #ff5c35;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 32px;
    background:
      radial-gradient(60% 50% at 70% 10%, rgba(255, 92, 53, 0.12), transparent 70%),
      var(--bg);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 560px; }
  .tag {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .tag::before { content: ""; width: 22px; height: 1px; background: currentColor; }
  h1 {
    font-family: var(--serif);
    font-weight: 320;
    font-size: clamp(5rem, 16vw, 9rem);
    line-height: 0.82;
    letter-spacing: -0.045em;
    word-spacing: 0.06em;
    margin: 18px 0 22px;
  }
  h1 em { color: var(--accent); font-style: italic; }
  p { color: #b6bcc1; line-height: 1.7; max-width: 42ch; margin: 0 0 28px; }
  a.btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    height: 46px;
    padding: 0 22px;
    border-radius: 999px;
    background: var(--accent);
    color: #170704;
    font-size: 13px;
    font-weight: 500;
    text-decoration: none;
    transition: transform 0.4s cubic-bezier(.16,1,.3,1), background 0.3s;
  }
  a.btn:hover { background: #ff7a58; transform: translateY(-2px); }
  .foot {
    margin-top: 40px;
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
</style>
</head>
<body>
  <div class="wrap">
    <span class="tag">Error 404</span>
    <h1>Off the <em>map.</em></h1>
    <p>This point isn't in the space I know. The page may have moved, or the metric is playing tricks.</p>
    <a class="btn" href="/">← Back to Sicheng Qian</a>
    <p class="foot">qian.917@osu.edu</p>
  </div>
</body>
</html>
